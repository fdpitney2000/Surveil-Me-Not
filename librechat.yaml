version: 1.3.17
cache: true

# Privacy hygiene: only the selected tier's OpenRouter endpoint should receive user content.
# Keep third-party egress off in the UI. Provider keys for these features must also stay unset
# in .env. See the privacy audit in PLAN.md.
interface:
  webSearch: false
  runCode: false
  fileSearch: false
  # MCP is off because no mcpServers are configured; `interface.mcpServers` is an object
  # (UI policy), not a boolean.

# Surveil-Me-Not privacy tiers. Each tier is a custom endpoint whose requests are
# routed through OpenRouter. Per-user keys are provisioned server-side into the
# encrypted key store (apiKey: user_provided) and are never shown to the client
# (hideUserProvidedKey: true). Choosing the endpoint chooses the tier.
surveil:
  enabled: true
  # Free users get limit-0 OpenRouter keys at signup so they can browse the real
  # catalog and use :free models; payment raises limits via the reconciler.
  provisionOnRegistration: true
  # The three tier definitions. Defaults exist in code; declared here for clarity.
  tiers:
    - tier: 1
      endpoint: 'Max Model Selection'
      description: 'Full OpenRouter catalog. No privacy filtering on requests.'
    - tier: 2
      endpoint: 'Commercial Privacy'
      description: 'Routes only to providers that do not collect or train on your data.'
    - tier: 3
      endpoint: 'Enterprise Vault'
      description: 'Zero Data Retention enforced; routes only to ZDR endpoints.'

endpoints:
  custom:
    - name: 'Max Model Selection'
      apiKey: 'user_provided'
      hideUserProvidedKey: true
      baseURL: 'https://openrouter.ai/api/v1'
      description: 'Full OpenRouter catalog. No privacy filtering on requests.'
      models:
        # Fallback only: the catalog is fetched per user with their provisioned
        # OpenRouter key (guardrail-filtered). The fallback is a free model so an
        # unsubscribed (limit-0) user can still call it if the fetch ever fails.
        default:
          - 'google/gemma-4-31b-it:free'
        fetch: true
      titleConvo: true
      # Free model so title generation works for unsubscribed (limit-0) users.
      titleModel: 'google/gemma-4-31b-it:free'
      modelDisplayLabel: 'Max Model Selection'

    - name: 'Commercial Privacy'
      apiKey: 'user_provided'
      hideUserProvidedKey: true
      baseURL: 'https://openrouter.ai/api/v1'
      description: 'Routes only to providers that do not collect or train on your data.'
      models:
        # Fallback only: the catalog is fetched per user with their provisioned
        # OpenRouter key (guardrail-filtered). The fallback is a free model so an
        # unsubscribed (limit-0) user can still call it if the fetch ever fails.
        default:
          - 'google/gemma-4-31b-it:free'
        fetch: true
      titleConvo: true
      # Free model so title generation works for unsubscribed (limit-0) users.
      titleModel: 'google/gemma-4-31b-it:free'
      modelDisplayLabel: 'Commercial Privacy'
      # Server-side guarantee: only providers that do not collect/train on data.
      addParams:
        provider:
          data_collection: 'deny'

    - name: 'Enterprise Vault'
      apiKey: 'user_provided'
      hideUserProvidedKey: true
      baseURL: 'https://openrouter.ai/api/v1'
      description: 'Zero Data Retention enforced; routes only to ZDR endpoints.'
      models:
        # Fallback only: the catalog is fetched per user with their provisioned
        # OpenRouter key (guardrail-filtered). The fallback is a free model so an
        # unsubscribed (limit-0) user can still call it if the fetch ever fails.
        default:
          - 'google/gemma-4-31b-it:free'
        fetch: true
      titleConvo: true
      # Free model so title generation works for unsubscribed (limit-0) users.
      titleModel: 'google/gemma-4-31b-it:free'
      modelDisplayLabel: 'Enterprise Vault'
      # Server-side guarantee: Zero Data Retention plus no data collection.
      addParams:
        provider:
          zdr: true
          data_collection: 'deny'
