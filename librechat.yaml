version: 1.3.17
cache: true

# Privacy hygiene: only the selected tier's OpenRouter endpoint should receive user content.
# Web search is temporarily enabled for beta testing through Tavily, which is third-party
# egress. Provider keys for other optional features must stay unset in .env. See the privacy
# audit in PLAN.md.
interface:
  webSearch: true
  runCode: false
  fileSearch: false
  # Consumer defaults: keep Parameters (web search on/off) but hide the more
  # advanced library/agent surfaces.
  parameters: true
  bookmarks: false
  memories: false
  prompts: false
  marketplace:
    use: false
  mcpServers:
    use: false
    create: false
    share: false

# Tavily is the temporary search provider for beta testing. It is third-party egress:
# search queries and returned page excerpts leave the deployment. Tier 2/3 should not be
# marketed as end-to-end ZDR while this is enabled; replace it with a ZDR-compliant provider
# before making that claim.
webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  rerankerType: none
  tavilyApiKey: '${TAVILY_API_KEY}'

# Surveil-Me-Not privacy tiers. Each tier is a custom endpoint whose requests are
# routed through OpenRouter. Per-user keys are provisioned server-side into the
# encrypted key store (apiKey: user_provided) and are never shown to the client
# (hideUserProvidedKey: true). Choosing the endpoint chooses the tier.
surveil:
  enabled: true
  # Beta: paid subscribers get a single provisioned key after invoice.paid. Free users
  # get a per-user $2/month key on first use (or at registration), assigned to the
  # `surveil:free` guardrail. The free tier resets at the calendar month.
  provisionOnRegistration: false
  freeTierEnabled: true
  freeTierMonthlyUsd: 2
  freeTierGlobalUsd: 10
  # The three tier definitions. Defaults exist in code; declared here for clarity.
  tiers:
    - tier: 1
      endpoint: 'Max Model Selection'
      label: 'Anon'
      description: 'your identity is protected'
    - tier: 2
      endpoint: 'Commercial Privacy'
      label: 'Anon + No Training'
      description: 'your data will not be used to improve AI'
    - tier: 3
      endpoint: 'Enterprise Vault'
      label: 'Anon + No Training + ZDR'
      description: 'Zero Data Retention for max privacy'

endpoints:
  custom:
    - name: 'Max Model Selection'
      apiKey: 'user_provided'
      hideUserProvidedKey: true
      baseURL: 'https://openrouter.ai/api/v1'
      description: 'your identity is protected'
      models:
        # Fallback only: the catalog is fetched with the management key. The pinned
        # subsidized model keeps an unsubscribed user able to chat if the fetch fails.
        default:
          - 'deepseek/deepseek-v4.1-flash'
        fetch: true
      titleConvo: true
      # Pinned subsidized model so title generation also works for free-tier users.
      titleModel: 'deepseek/deepseek-v4.1-flash'
      modelDisplayLabel: 'Anon'

    - name: 'Commercial Privacy'
      apiKey: 'user_provided'
      hideUserProvidedKey: true
      baseURL: 'https://openrouter.ai/api/v1'
      description: 'your data will not be used to improve AI'
      models:
        # Fallback only: the catalog is fetched with the management key. Never fall
        # back to a free model here; higher tiers must not advertise data-training models.
        default:
          - 'openai/gpt-4o-mini'
        fetch: true
      titleConvo: true
      # Paid title model: titles must not send prompt text to a data-training endpoint.
      titleModel: 'openai/gpt-4o-mini'
      modelDisplayLabel: 'Anon + No Training'
      # Server-side guarantee: only providers that do not collect/train on data.
      addParams:
        provider:
          data_collection: 'deny'

    - name: 'Enterprise Vault'
      apiKey: 'user_provided'
      hideUserProvidedKey: true
      baseURL: 'https://openrouter.ai/api/v1'
      description: 'Zero Data Retention for max privacy'
      models:
        # Fallback only: the catalog is fetched with the management key. Never fall
        # back to a free model here; higher tiers must not advertise data-training models.
        default:
          - 'openai/gpt-4o-mini'
        fetch: true
      titleConvo: true
      # Paid title model: titles must not send prompt text to a data-training endpoint.
      titleModel: 'openai/gpt-4o-mini'
      modelDisplayLabel: 'Anon + No Training + ZDR'
      # Server-side guarantee: Zero Data Retention plus no data collection.
      addParams:
        provider:
          zdr: true
          data_collection: 'deny'
