# Surviel-Me-Not local overrides. Auto-applied by `docker compose` on top of docker-compose.yml.
#
# Builds THIS repo (upstream compose only pulls a prebuilt image) and runs it under
# `surveil-*` container names on host port 3080.
#
#   docker compose -p surveil up -d --build
#
# Then open http://localhost:3080
services:
  api:
    image: surveil-me-not-local
    container_name: surveil-api
    # The upstream compose uses ${UID}:${GID}; supply a macOS-safe default when unset.
    user: '${UID:-501}:${GID:-20}'
    build:
      context: .
      target: node
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - DOMAIN_CLIENT=http://localhost:3080
      - DOMAIN_SERVER=http://localhost:3080
    # Pin the mapping explicitly (replaces the upstream `${PORT}:${PORT}` value).
    ports: !override
      - '3080:3080'
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro

  mongodb:
    container_name: surveil-mongodb
    user: '${UID:-501}:${GID:-20}'
  meilisearch:
    container_name: surveil-meilisearch
    user: '${UID:-501}:${GID:-20}'
  vectordb:
    container_name: surveil-vectordb
  rag_api:
    container_name: surveil-rag_api
  admin-panel:
    # The admin panel is not needed for MVP testing and its default port clashes.
    profiles: ['admin']
    container_name: surveil-admin-panel
