# Single-file deployment stack for Surveil-Me-Not.
#
# Merges docker-compose.yml + docker-compose.override.yml into one file a VPS can
# point at directly. Unlike the stock LibreChat compose, `api` is BUILT FROM THIS
# REPOSITORY (Dockerfile, target `node`), so the Surveil Me Not landing page,
# branding and privacy features are included instead of the upstream image.
#
#   docker compose -f deploy-surveil.yml up -d --build                    # app on :3080
#   docker compose -f deploy-surveil.yml --profile proxy up -d --build    # + Caddy TLS
#   docker compose -f deploy-surveil.yml --profile admin up -d            # + admin panel
#
# Create `.env` first — see the deployment notes in the project README / chat.

services:
  api:
    image: surveil-me-not-local
    container_name: surveil-api
    build:
      context: .
      target: node
    restart: always
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    depends_on:
      - mongodb
      - meilisearch
      - rag_api
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - LIBRECHAT_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,surveil-mongodb,meilisearch,surveil-meilisearch,rag_api,surveil-rag_api,vectordb,surveil-vectordb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,surveil-mongodb,meilisearch,surveil-meilisearch,rag_api,surveil-rag_api,vectordb,surveil-vectordb,host.docker.internal
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill
      - librechat-data:/app/data

  mongodb:
    container_name: surveil-mongodb
    image: mongo:8.0.20
    restart: always
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth

  meilisearch:
    container_name: surveil-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.35.1:/meili_data

  vectordb:
    container_name: surveil-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: always
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - pgdata2:/var/lib/postgresql/data

  rag_api:
    container_name: surveil-rag_api
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    restart: always
    depends_on:
      - vectordb
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    env_file:
      - .env

  # Automatic HTTPS in front of the app. Enable with `--profile proxy` after
  # setting DOMAIN in .env and pointing the domain's DNS at this server.
  # Caddy obtains and renews the certificate; no Caddyfile needed.
  caddy:
    container_name: surveil-caddy
    image: caddy:2-alpine
    profiles: ['proxy']
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to api:3080
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # Optional operator panel; not needed for the MVP. Enable with `--profile admin`.
  admin-panel:
    container_name: surveil-admin-panel
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    profiles: ['admin']
    restart: always
    depends_on:
      - api
    ports:
      - "${ADMIN_PANEL_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:${PORT:-3080}
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3080}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}

volumes:
  pgdata2:
  librechat-data:
  caddy-data:
  caddy-config:
